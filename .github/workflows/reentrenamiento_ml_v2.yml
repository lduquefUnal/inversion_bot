name: MLOps - Reentrenamiento Mensual Algoritmo V2

on:
  schedule:
    - cron: '0 0 1 * *' # Se ejecuta automáticamente a las 00:00 UTC el día 1 de cada mes
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub UI en cualquier momento

jobs:
  reentrenamiento-ml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias de Machine Learning
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn lightgbm joblib matplotlib

      - name: Etapa 1 - Extracción de Dataset (100 Activos / 1 Año)
        run: python flujo_ml/1_extraer_dataset.py

      - name: Etapa 2 - Entrenamiento LightGBM & Rolling Windows
        run: python flujo_ml/2_entrenar_lightgbm.py

      - name: Etapa 3 - Evaluación Financiera & Reglas SHAP
        run: python flujo_ml/3_evaluar_y_reglas.py

      - name: Etapa 4 - Inferencia y Quant Risk Engine
        run: python flujo_ml/4_inferencia_oraculo.py

      - name: Commit y Push de Artefactos de Modelo y Métricas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action MLOps"
          git add Modelos/ flujo_datos/
          git commit -m "🤖 MLOps: Re-entrenamiento Mensual Modelo V2 y Métricas Actualizadas" || echo "No hay cambios para comitear"
          git push
