name: Sistema de Inversión Automático - Alertas Cripto

on:
  schedule:
    # 22:00 UTC = 05:00 PM (17:00) en Hora de Colombia (UTC-5)
    # Recomendado al caer la tarde / cierre de bolsa US clásica.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-bot-cripto:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Ejecutar script de reporte Criptomonedas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python reporte_criptos.py
