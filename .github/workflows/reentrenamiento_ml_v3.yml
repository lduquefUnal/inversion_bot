name: MLOps - Reentrenamiento & Optimización V3.7 (F0.5 Score)

on:
  schedule:
    - cron: '0 0 1 * *' # Se ejecuta automáticamente a las 00:00 UTC el día 1 de cada mes
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub UI en cualquier momento

jobs:
  reentrenamiento-ml-v3:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias MLOps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scikit-learn lightgbm joblib matplotlib

      - name: 1. Descarga de OHLCV Histórico (5 Años / 227 Tickers)
        run: python flujo_ml/11_descargar_ohclv.py

      - name: 2. Generación del Dataset V3 con 33 Features
        run: python flujo_ml/v3_dataset.py

      - name: 3. Optimización Dinámica de Umbrales F0.5 Per-Categoría
        run: python flujo_ml/v3_threshold_por_cat.py

      - name: 4. Entrenamiento de 4 Modelos Especializados por Categoría
        run: python flujo_ml/v3_entrenar_por_cat.py

      - name: 5. Análisis SHAP & Importancia de Variables
        run: python flujo_ml/v3_shap_analysis.py

      - name: 6. Evaluación del Backtest Consolidado OOS
        run: python flujo_ml/v3_backtest_eval.py

      - name: 7. Auditoría de Data Drift (PSI) & Registro Mensual de Modelos
        run: python flujo_ml/v3_drift_monitor.py

      - name: 8. Inferencia en Vivo V3 (Oráculo MLOps)
        run: python flujo_ml/4_inferencia_oraculo.py

      - name: 9. Sincronización Automática de Artefactos MLOps & Registros
        run: python mlops/sync_artifacts.py

      - name: Commit y Push de Artefactos de Modelo V3, Registro & Drift Report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action MLOps V3"
          git add Modelos/ flujo_datos/ frontend/public/
          git commit -m "🤖 MLOps: Re-entrenamiento Mensual V3.7, Registro y Reporte de Drift (PSI)" || echo "No hay cambios para comitear"
          git push
