name: Orquestador - Inferencia ML V3.7 & Sync Supabase (Modo Ligero)

on:
  schedule:
    - cron: '0 13,16,19,21 * * 1-5' # 4x al día en días hábiles de mercado (UTC: 13:00, 16:00, 19:00, 21:00)
  workflow_dispatch:

jobs:
  flujo-orquestado:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install -r requerimientos_bot.txt

      - name: Paso 1 - Extracción Ligera de Datos de Mercado
        run: python flujo/paso1_descargar.py --ligero

      - name: Paso 2 - Inferencia en Tiempo Real Modelo V3.7
        run: python flujo_ml/4_inferencia_oraculo.py

      - name: Paso 3 - Publicar resultados en Supabase PostgreSQL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python utils/publicar_supabase.py
