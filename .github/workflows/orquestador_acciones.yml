name: Orquestador - Análisis de Acciones & Inferencia ML V2

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC (6:00 AM Colombia/Perú UTC-5)
  workflow_dispatch:

jobs:
  flujo-orquestado:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install -r requerimientos_bot.txt

      - name: Paso 1 - Agente de Extracción de Datos de Mercado
        run: python flujo/paso1_descargar.py

      - name: Paso 2 - Inferencia en Tiempo Real Modelo V2 (lightgbm_v2.pkl)
        run: python flujo_ml/4_inferencia_oraculo.py

      - name: Paso 3 - Agente Analista (Gemini IA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python flujo/paso2_analizar.py || echo "Ignorando si Gemini API no está configurado"

      - name: Auto-Commit de Datos Persistentes (Despliegue Automático en Vercel)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flujo_datos/ Modelos/
          git commit -m "🤖 MLOps: Inferencia Diaria Modelo V2 y Actualización Web Vercel" || echo "No hay cambios para hacer commit"
          git push
