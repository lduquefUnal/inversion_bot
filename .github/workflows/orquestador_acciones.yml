name: Orquestador - Análisis de Acciones

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC equivale a las 6:00 AM en Colombia/Perú (UTC-5)
  workflow_dispatch:

jobs:
  flujo-orquestado:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <- Token temporal seguro de GitHub (No usa tu usuario)
      
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requerimientos_bot.txt
          pip install pyTelegramBotAPI matplotlib pandas mplfinance
          
      - name: Paso 1 - Agente de Extracción, Gráficas y Macro
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python flujo/paso1_descargar.py
        
      - name: Paso 2 - Agente Analista ReAct Multitool (Gemini IA)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python flujo/paso2_analizar.py
        
      - name: Paso 3 - Motor de Backtesting por Estrategia y Categoría
        run: python flujo/backtest_engine.py

      - name: Paso 4 - Distribución Opcional a Telegram (.md y PNGs)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python flujo/paso3_enviar.py
        
      - name: Auto-Commit de Datos Persistentes (Activa a Vercel)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add flujo_datos/
          git commit -m "🤖 Memoria Diaria: Actualización de Gráficas y Reporte IA" || echo "No hay cambios para hacer commit"
          git push
