name: MLOps - Reentrenamiento Semanal Algoritmo V4.0 Tactical

on:
  schedule:
    - cron: '0 0 * * 0' # Todos los domingos a las 00:00 UTC (reentrenamiento semanal)
  workflow_dispatch:      # Permite dispararlo manualmente desde GitHub Actions UI

jobs:
  reentrenamiento-v4:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias MLOps
        run: |
          python -m pip install --upgrade pip
          pip install -r requerimientos_bot.txt

      - name: 1. Actualización Incremental de Caché OHLCV
        run: python flujo_ml/12_actualizar_ohlcv.py

      - name: 2. Entrenamiento & Optimización F0.5 Modelo V4.0 Tactical
        run: python flujo_ml/v4_entrenar_modelo.py

      - name: 3. Auditoría MLOps y Verificación de Integridad
        run: python flujo_ml/v4_auditor_agent.py

      - name: 4. Inferencia Oráculo V4 en Vivo
        run: python flujo_ml/4_inferencia_oraculo.py

      - name: 5. Sincronizar Resultados con Supabase PostgreSQL
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python utils/publicar_supabase.py

      - name: 6. Commit & Push de Artefactos de Modelo V4 y Predicciones
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action MLOps V4"
          git add Modelos/ flujo_datos/ frontend/public/
          git commit -m "🤖 MLOps: Re-entrenamiento Semanal V4.0 Tactical, Modelo Actualizado y Métricas OOS" || echo "No hay cambios para comitear"
          git push
