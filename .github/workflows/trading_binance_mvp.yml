name: MVP - Trading Binance Señales (Franjas de Tiempo)

on:
  schedule:
    - cron: '0 */4 * * *'  # Cada 4 horas (franjas de tiempo)
  workflow_dispatch:        # Disparo manual

jobs:
  trading-mvp:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libomp-dev

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requerimientos_bot.txt

      - name: Generar señales de trading MVP (Paper Mode)
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: python flujo_ml/binance_mvp_signales.py

      - name: Commit y push de señales generadas
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action MVP Trading"
          git add flujo_datos/binance_signales.json flujo_datos/binance_estado.json
          git commit -m "📊 MVP: Señales de trading Binance (franja ${{ github.event.schedule || 'manual' }})" || echo "No hay cambios para comitear"
          git push
